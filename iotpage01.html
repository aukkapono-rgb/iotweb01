<!-- HTML เป็นภาษาที่ใช้ในการทำโครงหน้าเว็บ -->
<!DOCTYPE html>

<html lang="en">
    <!-- ส่วนของ head การกำหนดรายละเอียดของเว็บหรือของเพจ -->
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="เขียนอธิบายเกี่ยวกับเว็บหรือเว็บเพจของเรา...." />
        <meta name="keywords" content="เขียนเป็นคำๆ สำคัญเกี่ยวกับเว็บหรือเว็บเพจของเรา...." />
        <title>mypage - iot</title>
        <link rel="shortcut icon" href="./images/rabbit.png" type="image/x-icon">
    </head>

    <!-- ส่วนของ body การกำหนดรายละเอียดที่จะแสดงที่หน้า Browser -->
    <body>
         <!-- HTML : Line Break TAG (ขึ้นบรรทัดใหม่), Horizontal Rule TAG (เส้นแบ่ง)-->
        AAAAA <br><br>
        <!-- HTML : Pre formatted text TAG -->
         <pre>
            <hr>
        BBBBB <br><br>
                BBBB&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;BBBB <br><br>      CCCCCCCCC <br><br>
                FFFFFFFFF <br><br>
                            FFFFFFFFFFF <br><br>
                            GGGGGGG&nbsp;&nbsp;&nbsp;&nbsp;GGGGGGGG&nbsp;&nbsp;&nbsp;&nbsp;GGGGGGGG <br><br>
      </pre>
     </body>
</html>
